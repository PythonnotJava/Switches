name: switches
description: "LLM服务商协议互相转换的轻量级软件 - OpenAI/Gemini/Claude"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 状态管理
  provider: ^6.1.2
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # HTTP服务器
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5
  # HTTP客户端
  http: ^1.2.2
  # 工具
  uuid: ^3.0.7
  path_provider: ^2.1.5
  # PC窗口管理
  window_manager: ^0.4.3
  # 系统托盘
  system_tray: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/icons/app_icon_1024.png
    - assets/icons/app_icon_512.png
    - assets/icons/app_icon_256.png
    - assets/icons/app_icon_192.png
    - assets/icons/app_icon_128.png
    - assets/icons/app_icon_64.png
    - assets/icons/app_icon_48.png
    - assets/icons/app_icon_32.png
    - assets/icons/logo.png
